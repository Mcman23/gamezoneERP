<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <rect width="192" height="192" rx="40" fill="#0f1629"/>
  <rect x="16" y="16" width="160" height="160" rx="32" fill="#111827"/>
  <!-- Gamepad icon centered -->
  <g transform="translate(36, 52)">
    <!-- Body -->
    <rect x="0" y="20" width="120" height="60" rx="30" fill="#1e3a5f"/>
    <!-- D-pad -->
    <rect x="18" y="38" width="10" height="28" rx="3" fill="#3b82f6"/>
    <rect x="10" y="46" width="28" height="10" rx="3" fill="#3b82f6"/>
    <!-- Buttons -->
    <circle cx="88" cy="45" r="7" fill="#6366f1"/>
    <circle cx="102" cy="55" r="7" fill="#8b5cf6"/>
    <circle cx="88" cy="65" r="7" fill="#3b82f6"/>
    <circle cx="74" cy="55" r="7" fill="#06b6d4"/>
    <!-- Analog sticks -->
    <circle cx="40" cy="68" r="8" fill="#374151" stroke="#4b5563" stroke-width="2"/>
    <circle cx="80" cy="78" r="8" fill="#374151" stroke="#4b5563" stroke-width="2"/>
    <!-- Select/Start -->
    <rect x="52" y="47" width="8" height="5" rx="2" fill="#4b5563"/>
    <rect x="64" y="47" width="8" height="5" rx="2" fill="#4b5563"/>
  </g>
  <!-- Text -->
  <text x="96" y="162" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#60a5fa" text-anchor="middle" letter-spacing="2">PLAYROOM</text>
</svg>
